name: frontend
label: Frontend / Web
domain: frontend
summary: Interfaces where the hard part is perceived performance, state consistency, or accessibility.
target_roles:
  - frontend engineer
  - web developer
  - ui engineer
  - full stack engineer
metric_families:
  - Largest Contentful Paint
  - interaction latency
  - bundle size
  - accessibility violations
  - state divergence count
forbidden_ideas:
  - landing page clone
  - dashboard with hardcoded data
  - component library with no consumer
  - portfolio site
arxiv: false
default_mechanisms:
  - cache-invalidation
  - conflict-resolution
  - partial-failure
  - cost-attribution
demo_rule: The demo must include a Lighthouse or axe run with before/after numbers.
product_shape: A user completes one real task on a slow 3G phone and the UI never lies about its state.
product_metric_families:
  - time to first value
  - task completion rate
  - external users
  - retention

